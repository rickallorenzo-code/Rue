<style>
:root{
  --bg:#D9DEE7; --panel:#FBFBF8; --panel2:#ECEFF4; --ink:#1B2333; --ink2:#566076; --line:#C6CDD9;
  --blue:#1F3A93; --yellow:#F2B705; --yellow-ink:#2A2100; --red:#C9362F; --green:#2F8A55;
  --cond:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Helvetica,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0E1219;--panel:#1A2130;--panel2:#252E40;--ink:#ECEFF5;--ink2:#9BA6BA;--line:#313B4E;--blue:#3A5BC7;--green:#4CB97B;--red:#E25555}
}
:root[data-theme="dark"]{--bg:#0E1219;--panel:#1A2130;--panel2:#252E40;--ink:#ECEFF5;--ink2:#9BA6BA;--line:#313B4E;--blue:#3A5BC7;--green:#4CB97B;--red:#E25555}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:inherit}
body{background:#0E1219;color:var(--ink);font:400 15px/1.35 var(--body);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
[hidden]{display:none!important}

#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;overflow:clip;background:var(--bg)}
#app.rot{position:fixed;left:0;top:0;transform-origin:0 0;transform:rotate(90deg) translateY(-100%);
  padding-left:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-bottom,0px)}

/* ---------- scene ---------- */
#scene{position:relative;flex:0 0 54%;min-height:270px;overflow:hidden;overflow:clip;touch-action:none;cursor:grab;
  background:linear-gradient(#4F96D4 0%,#8FC2E6 38%,#CFE4EE 66%,#F2DDB0 88%,#E9C48C 100%)}
.land #scene{flex:1 1 auto;min-height:0}
#skyn{position:absolute;inset:0;background:linear-gradient(#060A1E 0%,#101B42 45%,#2A2F62 78%,#4A3F6B 100%);opacity:0;transition:opacity 5s}
#stars{position:absolute;inset:0 0 38% 0;opacity:0;transition:opacity 5s;
  background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#DDE6FF 1px,transparent 1.7px),radial-gradient(#fff .7px,transparent 1.2px);background-size:83px 67px,131px 97px,47px 53px;background-position:11px 9px,47px 31px,23px 40px}
#sun{position:absolute;right:14%;top:11%;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#FFF6CF,#FFD86B 70%,#F7B93E);
  box-shadow:0 0 28px 12px rgba(255,226,140,.5),0 0 90px 50px rgba(255,214,120,.22);transition:background 5s,box-shadow 5s}
.night #skyn,.night #stars{opacity:1}
.night #sun{background:radial-gradient(circle at 36% 34%,#FFFFFF,#DCE3F2 65%,#AEB8CF);box-shadow:inset -9px -5px 0 rgba(120,132,160,.55),0 0 26px 8px rgba(200,214,255,.22)}
.cloud{position:absolute;height:22px;border-radius:22px;background:linear-gradient(#fff 40%,#D3E0EC);opacity:.92;animation:drift linear infinite;transition:opacity 5s;filter:drop-shadow(0 6px 5px rgba(60,90,130,.12))}
.cloud::before,.cloud::after{content:"";position:absolute;background:linear-gradient(#fff 55%,#DCE7F1);border-radius:50%}
.cloud::before{width:46%;height:190%;left:13%;top:-95%}.cloud::after{width:38%;height:140%;right:12%;top:-58%}
.night .cloud{opacity:.1}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(115vw)}}

.night #ground,.night #waste,.night #pali{filter:brightness(.42) saturate(.8)}
.prop{position:absolute;z-index:3;transition:filter 5s}
.night .prop{filter:brightness(.4)}
#plaque{position:absolute;left:52px;top:103px;z-index:3;background:linear-gradient(#2A4DB5,#1A3280);color:#fff;border-radius:5px;padding:3px 6px 4px;text-align:center;white-space:nowrap;
  font-family:var(--cond);letter-spacing:.06em;line-height:1;box-shadow:0 0 0 1.5px #152A6B,inset 0 0 0 1.5px #fff,inset 0 9px 7px -6px rgba(255,255,255,.35),0 3px 4px rgba(0,0,0,.4)}
#plaque span{display:block;font-size:7px;font-weight:600;margin-bottom:1px}
#plaque strong{display:block;font-size:11.5px;font-weight:700}

#lots{position:absolute;top:0;bottom:0;display:flex;z-index:4}
#props{position:absolute;left:0;top:0;right:0;bottom:0;z-index:5;pointer-events:none}
.lot{position:relative;flex:0 0 132px;height:100%;background:none;border:0;padding:0;margin:0;cursor:pointer;display:block}
.lot[disabled]{cursor:default}
.bsvg{position:absolute;left:0;bottom:56px;display:block;overflow:visible}
.bsvg .shade{fill:#070B24;opacity:0;transition:opacity 5s}
.bsvg .lit{opacity:0;transition:opacity 5s}
.night .bsvg .shade{opacity:.62}
.night .bsvg .lit{opacity:1}
.lot.far .bsvg{opacity:.45;filter:saturate(.5)}
.lot.sel::after{content:"";position:absolute;left:6px;right:14px;bottom:44px;height:7px;border-radius:4px;background:linear-gradient(#FFD34D,#E0A500);box-shadow:0 0 10px 2px rgba(255,200,40,.55),0 2px 0 rgba(0,0,0,.35);pointer-events:none;z-index:5}
.tag{position:absolute;left:50%;transform:translateX(-50%);background:linear-gradient(#FFD34D,#E9AE00);color:var(--yellow-ink);font:700 14px/1 var(--cond);
  padding:5px 9px;border-radius:7px;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 0 #8A6A00,0 4px 6px rgba(0,0,0,.3);z-index:2}
.tag::after{content:"";position:absolute;left:50%;top:100%;margin-left:-2px;width:4px;height:12px;background:#5A4326}
.badge{position:absolute;left:50%;transform:translateX(-50%);background:linear-gradient(#fff,#E6EAF0);color:#1B2333;font:700 13px/1 var(--cond);padding:4px 7px;border-radius:9px;
  white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.3),0 4px 8px rgba(0,0,0,.25);z-index:3;animation:bob 1.6s ease-in-out infinite}
.badge:empty{display:none}
@keyframes bob{50%{transform:translate(-50%,-4px)}}

#gate{position:absolute;bottom:54px;width:118px;height:236px;z-index:8;background:none;border:0;padding:0;cursor:pointer;transition:filter 5s}
#gate svg.gsvg{position:absolute;left:0;bottom:0;overflow:visible}
.night #gate{filter:brightness(.6) saturate(.85)}
#gate .glow{opacity:0;transition:opacity 5s}
.night #gate .glow{opacity:1}
#gate.shake .doors{animation:shake .25s linear infinite}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
#mamie{position:absolute;left:50px;bottom:140px;transform-origin:70% 90%}
#mamie.fire{animation:recoil .22s}
@keyframes recoil{30%{transform:translateX(5px) rotate(4deg)}}
#gatehp{position:absolute;left:5px;right:45px;top:84px;height:8px;z-index:2;background:rgba(0,0,0,.55);border-radius:5px;overflow:hidden;box-shadow:0 0 0 1.5px rgba(255,255,255,.35)}
#gatehp i{display:block;height:100%;width:100%;background:linear-gradient(#7BE39A,#3DAF63);transition:width .2s}
#gatehp.low i{background:linear-gradient(#FFD34D,#E0A500)}#gatehp.crit i{background:linear-gradient(#FF8A80,#D63C33)}

#walkers,#zlayer,#lootl,#fx{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
#walkers{z-index:6}#zlayer{z-index:10}#lootl{z-index:12}#fx{z-index:50}
.lg,.ar{transform-box:fill-box;transform-origin:50% 0}
.walk .lgA,.walk .arB{animation:swA .62s ease-in-out infinite}
.walk .lgB,.walk .arA{animation:swB .62s ease-in-out infinite}
.walk.quick .lg,.walk.quick .ar{animation-duration:.3s}
.walk.slow .lg,.walk.slow .ar{animation-duration:1s}
@keyframes swA{0%,100%{transform:rotate(17deg)}50%{transform:rotate(-17deg)}}
@keyframes swB{0%,100%{transform:rotate(-17deg)}50%{transform:rotate(17deg)}}
.z{position:absolute;left:0;width:60px;height:92px;margin-left:-30px;pointer-events:auto;cursor:pointer;will-change:transform;transition:filter 5s}
.z .zin{position:absolute;left:50%;bottom:0;transform:translateX(-50%);animation:lurch 1s ease-in-out infinite;transform-origin:50% 100%}
.z.fast .zin{animation-duration:.45s}.z.big .zin{animation-duration:1.4s}
.z.atk .zin{animation:bash .5s ease-in-out infinite}
.z.atk .lg{animation:none}
.z.hit .zin{filter:brightness(2.2) saturate(.3)}
.z.dead{pointer-events:none}.z.dead .zin{animation:die .5s forwards}
.z.flee{pointer-events:none;opacity:0;transition:opacity .5s}
@keyframes lurch{0%,100%{transform:translateX(-50%) rotate(-3deg)}50%{transform:translateX(-50%) rotate(4deg) translateY(-1.5px)}}
@keyframes bash{0%,100%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(-42%) rotate(9deg)}}
@keyframes die{to{transform:translateX(-50%) rotate(-88deg) translateY(12px);opacity:0}}
.zhp{position:absolute;left:12px;right:12px;bottom:66px;height:5px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden}
.zhp i{display:block;height:100%;background:linear-gradient(#FF8A80,#D63C33)}
.z.big .zhp{bottom:86px}
.night .z,.night .p,.night #knock svg{filter:brightness(.7) saturate(.85)}
.p{position:absolute;left:0;bottom:39px;will-change:transform}
.p .pin{animation:step .62s ease-in-out infinite;transform-origin:50% 100%}
.p.idle .pin{animation:none}
.p.idle .lg,.p.idle .ar{animation:none}
.p .hstar{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);font-size:11px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
@keyframes step{50%{transform:translateY(-1.5px)}}
#knock{position:absolute;bottom:40px;z-index:30;background:none;border:0;padding:0 8px;cursor:pointer}
#knock .bub,.speech{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);background:linear-gradient(#fff,#E6EAF0);color:#1B2333;font:700 13px/1 var(--cond);padding:5px 8px;border-radius:9px;white-space:nowrap;
  box-shadow:0 2px 0 rgba(0,0,0,.3),0 4px 8px rgba(0,0,0,.25);animation:bob 1.2s ease-in-out infinite}
.loot{position:absolute;width:36px;height:36px;margin-left:-18px;font-size:20px;line-height:36px;text-align:center;pointer-events:auto;cursor:pointer;
  animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
.loot.nut{font-size:23px;filter:drop-shadow(0 0 6px rgba(255,215,90,.95)) drop-shadow(0 3px 2px rgba(0,0,0,.45))}
.loot.take{pointer-events:none;animation:take .4s ease-in forwards}
@keyframes pop{from{transform:translateY(-26px) scale(.3)}}
@keyframes take{to{transform:translateY(-70px) scale(.5);opacity:0}}
.ft{position:absolute;font:700 15px/1 var(--cond);color:#fff;text-shadow:0 1px 0 #000,0 0 4px rgba(0,0,0,.7);white-space:nowrap;animation:rise .9s ease-out forwards}
.ft.pow{font-size:22px;animation:pow .3s ease-out forwards}
@keyframes rise{to{transform:translateY(-36px);opacity:0}}
@keyframes pow{from{transform:scale(.4)}to{transform:scale(1.3);opacity:0}}
.tracer{position:absolute;height:2px;background:linear-gradient(90deg,#FFF3B0,rgba(255,243,176,0));transform-origin:0 50%;animation:fade .14s linear forwards}
@keyframes fade{to{opacity:0}}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.bcard{display:flex;flex-direction:column;align-items:stretch;text-align:center;background:linear-gradient(var(--panel),var(--panel2));border:2px solid var(--line);border-radius:14px;padding:6px 5px 7px;cursor:pointer;min-width:0;color:var(--ink);box-shadow:0 2px 5px rgba(20,30,50,.14)}
.bcard:active{transform:translateY(2px)}
.bcard.off{opacity:.55}
.bcard b{font:700 15.5px/1.1 var(--cond);display:block;margin:6px 0 3px;min-height:34px}
.bcard small{display:block;color:var(--ink2);font-size:12px;line-height:1.2;min-height:29px}
.bcard .tagk{align-self:center;font-size:12px;margin-bottom:2px}
.bcard .price{display:block;font:700 15.5px/1 var(--cond);background:linear-gradient(#FFD34D,#E9AE00);color:#2A2100;border-radius:8px;padding:7px 2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 0 #8A6A00;margin-top:5px}
.pv{position:relative;height:120px;border-radius:10px;overflow:hidden;background:linear-gradient(#7FB8E2,#D2E6EF 63%,#B5AFA2 63%,#989286)}
.pv .bsvg{position:absolute;left:50%;bottom:5px;width:76px;height:auto;transform:translateX(-50%)}
.pv.big .bsvg{width:108px}
.wcard{text-align:center}
.whead{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:4px}
.whead .av{width:84px;height:100px;border-radius:16px;border:3px solid #7A3B1E;background:radial-gradient(circle at 50% 30%,#F6D9A8,#D99A4E)}
.whead .av svg{margin-top:6px}
.burst{position:relative;width:78px;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2A2100;flex:0 0 auto}
.burst svg{position:absolute;inset:0;width:100%;height:100%}
.burst small{position:relative;font:700 9.5px/1 var(--cond);letter-spacing:.08em;color:#2A2100}
.burst b{position:relative;font:700 31px/1 var(--cond)}
.quote{font:500 17px/1.3 var(--body);font-style:italic;margin:8px 6px}
.pband{display:flex;align-items:center;justify-content:center;gap:7px;color:#fff;font:700 18px/1 var(--cond);padding:10px;border-radius:10px;margin:8px 0;text-shadow:0 1px 0 rgba(0,0,0,.35);letter-spacing:.05em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.btn.go{background:linear-gradient(#36C7A0,#178F78);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 #0E5F50,0 5px 8px rgba(0,0,0,.2)}
.wcard .btnrow .btn{font-size:21px;padding:15px 8px}
#popsign{position:absolute;left:60px;top:135px;z-index:3;background:linear-gradient(#2E8B57,#1F6B41);color:#fff;border-radius:4px;padding:3px 7px 4px;font:700 10.5px/1 var(--cond);letter-spacing:.07em;white-space:nowrap;box-shadow:0 0 0 1.5px #fff,0 0 0 2.6px #1F6B41,0 3px 4px rgba(0,0,0,.4)}
.builder{position:absolute;left:12px;bottom:40px;z-index:4;pointer-events:none;animation:step .5s ease-in-out infinite;transition:filter 5s}
.builder .ham{position:absolute;left:25px;top:20px;font-size:15px;line-height:1;transform-origin:15% 85%;animation:ham .5s ease-in-out infinite}
@keyframes ham{0%,100%{transform:rotate(-55deg)}50%{transform:rotate(20deg)}}
.night .builder{filter:brightness(.7)}
.cab{position:absolute;left:44px;bottom:50px;width:44px;z-index:3;transform-origin:50% 100%;animation:cabshake 2.8s ease-in-out infinite}
.cab svg{display:block}
.cab .speech{font-size:12px;padding:4px 7px}
.lot.far .cab{opacity:.92}
@keyframes cabshake{0%,68%,100%{transform:rotate(0)}72%{transform:rotate(-3deg)}76%{transform:rotate(3deg)}80%{transform:rotate(-2.4deg)}84%{transform:rotate(1.6deg)}88%{transform:rotate(0)}}
.badge[data-act]{cursor:pointer;padding:6px 9px}
.tagk.pc{color:#fff;box-shadow:none;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.disc{display:inline-block;background:linear-gradient(#FFD34D,#E9AE00);color:#2A2100;font:700 15px/1 var(--cond);padding:6px 9px;border-radius:9px;transform:rotate(-3deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 0 #8A6A00;white-space:nowrap;flex:0 0 auto}
.bt{position:absolute;left:50%;transform:translateX(-50%);background:rgba(16,20,30,.88);color:#fff;font:700 13px/1 var(--cond);padding:4px 7px;border-radius:7px;white-space:nowrap;z-index:3;box-shadow:0 0 0 1px rgba(255,255,255,.15)}

/* ---------- overlays on the scene ---------- */
#vig{position:absolute;inset:0;z-index:55;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(6,10,24,.42) 100%)}
#hud{position:absolute;left:calc(6px + env(safe-area-inset-left,0px));right:calc(6px + env(safe-area-inset-right,0px));top:6px;z-index:60;display:flex;gap:4px;pointer-events:none}
.chip{display:flex;align-items:center;gap:3px;background:linear-gradient(#2E384E,#141A27);color:#fff;border-radius:999px;padding:5px 9px;font:700 16px/1 var(--cond);font-variant-numeric:tabular-nums;white-space:nowrap;
  border:1px solid rgba(0,0,0,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 5px rgba(0,0,0,.45)}
.chip .ico{font-size:12px}
.chip.gold{background:linear-gradient(#6B5310,#2E2203);color:#FFE9A8}
.chip.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.12)}}
#hud .sp{flex:1}
.hbtn{pointer-events:auto;flex:0 0 auto;width:34px;height:30px;border:1px solid rgba(0,0,0,.6);border-radius:999px;background:linear-gradient(#2E384E,#141A27);color:#fff;font-size:14px;cursor:pointer;padding:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 5px rgba(0,0,0,.45)}
#rail{position:absolute;left:calc(6px + env(safe-area-inset-left,0px));top:44px;z-index:60;display:flex;flex-direction:column;gap:6px}
.rb{position:relative;width:40px;height:40px;border-radius:50%;border:2px solid #1B1F28;background:radial-gradient(circle at 35% 30%,#fff,#D5DBE4);font-size:19px;line-height:1;cursor:pointer;padding:0;box-shadow:0 3px 6px rgba(0,0,0,.45),inset 0 -3px 4px rgba(0,0,0,.15)}
.rb.warn{background:repeating-linear-gradient(45deg,#F2B705 0 8px,#DFA400 8px 16px)}
.rb b{position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font:700 12px/18px var(--cond);padding:0 4px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
#camnav{position:absolute;right:calc(6px + env(safe-area-inset-right,0px));bottom:6px;z-index:60;display:flex;gap:6px}
#camnav button{width:38px;height:32px;border:1px solid rgba(0,0,0,.6);border-radius:10px;background:linear-gradient(rgba(46,56,78,.9),rgba(20,26,39,.9));color:#fff;font-size:14px;cursor:pointer;padding:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
#flash{position:absolute;inset:0;z-index:58;pointer-events:none;background:#D23B3B;opacity:0}
#flash.on{animation:flash .6s}
@keyframes flash{20%{opacity:.45}}
#toasts{position:absolute;left:54px;right:54px;top:42px;z-index:61;pointer-events:none;display:flex;flex-direction:column;gap:5px;align-items:center}
.toast{background:linear-gradient(rgba(36,44,62,.96),rgba(16,20,30,.96));color:#fff;padding:7px 11px;border-radius:10px;font:500 13.5px/1.25 var(--body);max-width:100%;text-align:center;animation:tin .25s ease-out;box-shadow:0 4px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.15)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

/* ---------- quest ---------- */
#quest{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-top:2px solid #0C0F16;border-bottom:1px solid #0C0F16;background:linear-gradient(#2B3448,#1A2130);color:#fff;padding:7px 12px;cursor:pointer;min-height:40px;flex:0 0 auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
#quest .qt{flex:1;min-width:0;font:500 14px/1.2 var(--body)}
#quest .qp{flex:0 0 auto;font:700 15px/1 var(--cond);color:#B9C4D9;font-variant-numeric:tabular-nums}
#quest.done{background:linear-gradient(#FFD34D,#E0A500);color:var(--yellow-ink)}
#quest.done .qp{color:var(--yellow-ink);background:rgba(255,255,255,.55);padding:6px 9px;border-radius:8px}
.land #quest{position:absolute;right:calc(48px + env(safe-area-inset-right,0px));top:6px;width:auto;max-width:42%;z-index:59;border:1px solid rgba(0,0,0,.6);border-radius:999px;min-height:30px;padding:5px 12px}
.land #quest .qt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- panel ---------- */
#panelwrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
#panel{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 14px;touch-action:pan-y}
#pclose{display:none}
.land #panelwrap{position:absolute;right:0;top:0;bottom:0;width:min(370px,48%);z-index:70;transform:translateX(102%);transition:transform .22s ease-out;box-shadow:-6px 0 18px rgba(0,0,0,.45)}
.land #panelwrap.open{transform:none}
.land #panelwrap:not(.open) #pclose{display:none}
.land #pclose{display:block;position:absolute;left:-42px;top:8px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,0,0,.6);background:linear-gradient(#2E384E,#141A27);color:#fff;font:700 18px/1 var(--cond);cursor:pointer}
#tabs{flex:0 0 auto;display:flex;background:linear-gradient(#252D3F,#121722);border-top:2px solid #0C0F16;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
#tabs button{flex:1;position:relative;border:0;background:none;padding:6px 1px 7px;cursor:pointer;font-size:17px;line-height:1.1;color:#9AA6BC}
#tabs button span{display:block;font:600 12.5px/1.1 var(--cond);margin-top:2px}
#tabs button.on{color:#fff;box-shadow:inset 0 3px 0 var(--yellow);background:linear-gradient(rgba(242,183,5,.16),transparent 70%)}
#tabs button i{position:absolute;right:calc(50% - 22px);top:3px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #1A2130}
.land #tabs{position:absolute;left:calc(6px + env(safe-area-inset-left,0px));bottom:6px;z-index:60;border:1px solid rgba(0,0,0,.6);border-radius:12px;overflow:hidden}
.land #tabs button{flex:0 0 auto;padding:5px 10px 6px;font-size:15px}
.land #tabs button span{font-size:11.5px}
h2{font:700 22px/1.1 var(--cond);margin:0 0 2px;letter-spacing:.01em}
h3{font:700 14px/1.1 var(--cond);margin:16px 0 7px;color:var(--ink2);text-transform:uppercase;letter-spacing:.09em}
p{margin:4px 0 10px}
.sub{color:var(--ink2);margin:0 0 10px}
.card{background:linear-gradient(var(--panel),var(--panel2));border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 5px rgba(20,30,50,.12)}
.card.locked{opacity:.55}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.row b{font:600 17px/1.15 var(--cond);display:block}
.row small,.card small{color:var(--ink2);font-size:13px;display:block;line-height:1.25}
.big{font-size:26px;line-height:1;flex:0 0 auto}
.btn{appearance:none;-webkit-appearance:none;border:0;border-radius:10px;padding:10px 13px;font:600 17px/1 var(--cond);background:linear-gradient(#3559D6,#1F3A93);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 #142766,0 5px 8px rgba(0,0,0,.2);cursor:pointer;white-space:nowrap;flex:0 0 auto;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 #142766}
.btn.y{background:linear-gradient(#FFD34D,#E9AE00);color:var(--yellow-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 3px 0 #8A6A00,0 5px 8px rgba(0,0,0,.2);text-shadow:none}
.btn.ghost{background:linear-gradient(var(--panel),var(--panel2));color:var(--ink);box-shadow:inset 0 0 0 1px var(--line),0 2px 0 var(--line);text-shadow:none}
.btn.red{background:linear-gradient(#E4584F,#B92C25);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 0 #7A1A15}
.btn.nutb{background:linear-gradient(#8A6A14,#4A3706);color:#FFE9A8;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 0 #2A1F02}
.btn.off{opacity:.45}
.btn.wide{display:block;width:100%;text-align:center;padding:12px 13px}
.btn.sm{padding:7px 10px;font-size:15px}
.btn .cost{opacity:.95;margin-left:5px;font-weight:700}
.av{flex:0 0 auto;width:36px;height:44px;border-radius:10px;background:radial-gradient(circle at 50% 30%,#DDE6F2,#AFBDD0);display:flex;align-items:flex-start;justify-content:center;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.av svg{display:block;margin-top:3px;flex:0 0 auto}
.lv{display:inline-block;min-width:20px;text-align:center;font:700 12px/1 var(--cond);padding:3px 5px;border-radius:6px;background:linear-gradient(#3559D6,#1F3A93);color:#fff;vertical-align:1px}
.star{color:#C98F00;font-weight:700}
.tagk{display:inline-block;flex:0 0 auto;white-space:nowrap;font:600 13px/1 var(--cond);padding:3px 6px;border-radius:6px;background:var(--panel2);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.prod{padding:10px 0;border-top:1px solid var(--line)}
.prod:first-of-type{border-top:0;padding-top:2px}
.prod .top{display:flex;align-items:center;gap:8px}
.prod .pn{flex:1;min-width:0}
.prod .pn b{font:600 17px/1.1 var(--cond);display:block}
.prod .pn small{color:var(--ink2);font-size:13px}
.prod .pst{font:600 15px/1 var(--cond);color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.prod .who{display:flex;align-items:center;gap:8px;margin-top:7px}
.who .slot{flex:1;min-width:0;display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:5px 8px;cursor:pointer;text-align:left;min-height:52px}
.who .slot.full{border-style:solid;background:var(--panel)}
.who .slot b{font:600 15px/1.1 var(--cond);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .slot small{font-size:12px;color:var(--ink2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .slot .nm{flex:1;min-width:0}
.bar{height:7px;border-radius:4px;background:rgba(0,0,0,.14);overflow:hidden;margin-top:8px;box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(#5AD186,#2F8A55);border-radius:4px}
.bar.o i{background:linear-gradient(#6A8BF0,#2B49B0)}
.bar.g i{background:linear-gradient(#FFD34D,#E0A500)}
.empty-note{color:var(--ink2);text-align:center;padding:18px 10px}
.list .row{padding:9px 0;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.offer{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:linear-gradient(var(--panel),var(--panel2));border:2px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;cursor:pointer;box-shadow:0 2px 5px rgba(20,30,50,.12)}
.offer .em{flex:0 0 46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:25px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.offer b{font:700 18px/1.1 var(--cond);display:block}
.offer small{color:var(--ink2);font-size:13px;display:block}
.offer.off{opacity:.5}
.hero-card{display:flex;gap:11px;align-items:center}
.hero-card .av{width:54px;height:70px;border-radius:12px;background:radial-gradient(circle at 50% 30%,#FFF1BF,#E0B04A)}
.hero-card .av svg{margin-top:4px}
.hero-card.locked .av{background:radial-gradient(circle at 50% 30%,#DDE6F2,#AFBDD0);filter:grayscale(.85)}

/* ---------- sheet ---------- */
#sheet{position:absolute;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
#sheet-bg{position:absolute;inset:0;background:rgba(6,9,16,.62)}
#sheet-body{position:relative;width:100%;max-width:520px;max-height:84%;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 14px 18px;animation:up .22s ease-out;touch-action:pan-y;box-shadow:0 -6px 24px rgba(0,0,0,.4)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.hero{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.hero .av{width:66px;height:84px;border-radius:14px}
.hero .av svg{margin-top:5px}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1;text-align:center;padding:12px 8px}
.pickrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:linear-gradient(var(--panel),var(--panel2));border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:7px;cursor:pointer}
.pickrow .grow{flex:1;min-width:0}
.pickrow b{font:600 17px/1.1 var(--cond);display:block}
.pickrow small{color:var(--ink2);font-size:13px}
.pickrow.on{border-color:var(--yellow);box-shadow:0 0 0 2px rgba(242,183,5,.35)}
ul.tips{margin:8px 0 0;padding-left:20px}
.code{display:block;width:100%;height:120px;resize:none;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:11px/1.35 ui-monospace,Menlo,monospace;padding:8px;-webkit-user-select:text;user-select:text;word-break:break-all}
ul.tips li{margin-bottom:6px}

/* ---------- truck defence ---------- */
#mini{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;background:#0B0F1A;color:#fff;touch-action:none}
#mini-top{display:flex;align-items:center;gap:10px;padding:9px 12px;font:700 17px/1 var(--cond);background:linear-gradient(#252D3F,#121722);box-shadow:inset 0 -1px 0 #000}
#mini-top .sp{flex:1}
#mini-field{position:relative;flex:1;overflow:hidden;background:linear-gradient(#182247 0%,#3B3A68 48%,#8A5A4A 78%,#C98A4A 100%)}
#mini-field.day{background:linear-gradient(#4F96D4 0%,#9CCBE9 50%,#F2DDB0 100%)}
#mini-w{position:absolute;left:0;bottom:0;transform-origin:0 100%;height:300px}
#mini-sun{position:absolute;right:16%;top:11%;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 36% 34%,#fff,#DCE3F2 65%,#AEB8CF);box-shadow:inset -10px -6px 0 rgba(120,132,160,.55),0 0 30px 10px rgba(200,214,255,.2)}
#mini-field.day #mini-sun{background:radial-gradient(circle at 40% 38%,#FFF6CF,#FFD86B 70%,#F7B93E);box-shadow:0 0 30px 14px rgba(255,226,140,.5),0 0 100px 60px rgba(255,214,120,.22)}
#mini-field:not(.day) .cloud{opacity:.12}

.mstill #mini-fore{animation-play-state:paused}
@keyframes scrollfore{to{background-position:0 0,-240px 0}}

.mdir #mini-bg1,.mdir #mini-bg2,.mdir #mini-road{animation-direction:reverse}
.mstill #mini-bg1,.mstill #mini-bg2,.mstill #mini-road{animation-play-state:paused}
@keyframes scrollbg{to{background-position:480px 100%}}
@keyframes scrollbg2{to{background-position:560px 100%}}
@keyframes scrollroad{to{background-position:80px 8px}}
#mini-truck{position:absolute;bottom:26px;animation:rumble .22s linear infinite}
#mini-truck .gun{position:absolute;left:50%;bottom:74%;transform:translateX(-50%)}
@keyframes rumble{50%{transform:translateY(-1.5px)}}
.me{position:absolute;left:0;bottom:0;width:64px;height:100px;margin-left:-32px;will-change:transform;cursor:pointer}
.me .in{position:absolute;left:50%;bottom:0;transform:translateX(-50%)}
.me.flip .in{transform:translateX(-50%) scaleX(-1)}
.me.ko{pointer-events:none}.me.ko .in{animation:die .4s forwards}
.me.safe{pointer-events:none;opacity:0;transition:opacity .35s}
.me.rad .in{filter:drop-shadow(0 0 7px #B6FF3B)}
.me .tg{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);font-size:15px;animation:bob 1s ease-in-out infinite}
.boom{position:absolute;width:20px;height:20px;margin:-10px;border-radius:50%;background:radial-gradient(circle,#FFFBD0,#C8FF4A 45%,rgba(120,220,40,0) 70%);animation:boom .45s ease-out forwards;pointer-events:none}
@keyframes boom{to{transform:scale(11);opacity:0}}
#mini-banner{position:absolute;left:0;right:0;top:22%;text-align:center;font:700 30px/1.1 var(--cond);text-shadow:0 2px 0 #000,0 0 14px rgba(0,0,0,.7);pointer-events:none;opacity:0;transition:opacity .3s}
#mini-banner.on{opacity:1}
#mini-banner small{display:block;font:500 15px/1.3 var(--body);opacity:.92;margin-top:4px}
#mini-bot{display:flex;align-items:center;gap:10px;padding:9px 12px 12px;font:600 15px/1 var(--cond);background:linear-gradient(#252D3F,#121722);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
#mini-hpw{flex:1;min-width:0}
#mini-hpw small{display:block;font:600 12px/1 var(--cond);color:#B9C4D9;margin-bottom:4px}
#mini-hp{height:10px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
#mini-hp i{display:block;height:100%;width:100%;background:linear-gradient(#7BE39A,#3DAF63);transition:width .15s}
#mini-hp.low i{background:linear-gradient(#FFD34D,#E0A500)}#mini-hp.crit i{background:linear-gradient(#FF8A80,#D63C33)}
#mini-wbtn{background:none;border:0;color:#fff;padding:0;text-align:left;cursor:pointer;flex:0 1 auto;min-width:0;max-width:44%}
#mini-wbtn small{display:block;font:600 12px/1 var(--cond);color:#FFE08A;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.04em}
#mini-ammo{display:flex;gap:3px;flex-wrap:wrap}
.boom.w{background:radial-gradient(circle,#FFF6D0,#FFB347 45%,rgba(255,140,40,0) 70%)}
.offer.spec{border-color:#7A3FB0;background:linear-gradient(#F3E9FF,#E2D0F7)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .offer.spec{background:linear-gradient(#35214F,#2A1A40)}}
:root[data-theme="dark"] .offer.spec{background:linear-gradient(#35214F,#2A1A40)}
#mini-ammo i{width:8px;height:17px;border-radius:3px 3px 1px 1px;background:linear-gradient(#FFE08A,#D99F00)}
#mini-ammo i.u{background:rgba(255,255,255,.16)}
#mini-end{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,9,16,.7);padding:16px;z-index:5}
#mini-end .card{max-width:360px;width:100%;color:var(--ink);text-align:center}

/* ---------- landscape layout : free bottom, side buttons, centred windows ---------- */
@media (orientation:landscape){:root{padding-bottom:0}}
#pback{display:none}
.land #hud{right:calc(60px + env(safe-area-inset-right,0px))}
.land #tabs{left:auto;bottom:auto;right:calc(6px + env(safe-area-inset-right,0px));top:6px;z-index:72;flex-direction:column;gap:5px;background:none;border:0;border-radius:0;overflow:visible;box-shadow:none}
.land #tabs button{flex:0 0 auto;width:46px;height:42px;padding:0;border-radius:12px;border:1px solid rgba(0,0,0,.6);background:linear-gradient(#2E384E,#141A27);font-size:20px;line-height:40px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 5px rgba(0,0,0,.45)}
.land #tabs button span{display:none}
.land #tabs button.on{background:linear-gradient(#46557A,#1F2940);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 0 2px var(--yellow)}
.land #panelwrap:not(.open) ~ #tabs button.on{background:linear-gradient(#2E384E,#141A27);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 5px rgba(0,0,0,.45)}
.land #tabs button i{right:-3px;top:-3px;box-shadow:0 0 0 2px #141A27}
.land #quest{left:50%;right:auto;top:auto;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(56%,520px);box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.land #camnav{left:calc(6px + env(safe-area-inset-left,0px));right:calc(6px + env(safe-area-inset-right,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-between;pointer-events:none}
.land #camnav button{pointer-events:auto;width:44px;height:36px}
.land #panelwrap{left:50%;right:auto;top:50%;bottom:auto;width:min(580px,calc(100% - 250px));height:min(440px,calc(100% - 20px));transform:translate(-50%,-50%) scale(.94);opacity:0;pointer-events:none;border-radius:18px;overflow:hidden;z-index:71;box-shadow:0 0 0 3px rgba(10,14,22,.9),0 20px 60px rgba(0,0,0,.65);transition:transform .16s ease-out,opacity .16s}
.land #panelwrap.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.land #panelwrap.open + #pback{display:block;position:absolute;inset:0;z-index:69;background:rgba(6,9,16,.58)}
.land #pclose{left:auto;right:9px;top:9px;width:38px;height:38px;z-index:3;border:2px solid #7A1A15;background:linear-gradient(#E4584F,#B92C25);box-shadow:0 2px 5px rgba(0,0,0,.4)}
.land #panel{padding:14px 16px 16px}
.land #panel::before{content:"";float:right;width:42px;height:38px}
.land #sheet{align-items:center}
.land #sheet-body{border-radius:18px;max-height:92%}
.land #mini-bot{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:calc(12px + env(safe-area-inset-left,0px));padding-right:calc(12px + env(safe-area-inset-right,0px))}
.land #mini-top{padding-left:calc(12px + env(safe-area-inset-left,0px));padding-right:calc(12px + env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:reduce){
  .z .zin,.p .pin,.badge,#knock .bub,.cloud,.speech,.lg,.ar,.cab,.builder,.builder .ham,#mini-truck,#mini-fore,.mbg,#mini-road{animation:none!important}
  .z .zin{transform:translateX(-50%)}
  #skyn,#sun,#stars,.bsvg .shade,.bsvg .lit{transition:none}
}

    case 'claimKill': { if (S.kills < kmGoal(S.km)) break; const r = kmReward(S.km); S.coins += r.c || 0; S.nuts += r.n || 0; S.km++; dirty(); sfx.coin(); bump(r.n ? 'c-nuts' : 'c-coins'); toast('Prime de chasse : +' + costTxt(r) + '. Prochain palier : ' + fmt(kmGoal(S.km)) + ' zombies.'); railSig = ''; renderPanel(); break; }
    case 'claimAch': { const o = ACH.find(x => x.id === a); if (!o || S.ach.includes(a) || !achDone(o)) break; S.ach.push(a); S.coins += o.r.c || 0; S.supplies += o.r.s || 0; S.nuts += o.r.n || 0; dirty(); sfx.coin(); bump(o.r.n ? 'c-nuts' : 'c-sup'); toast('Succès « ' + o.n + ' » : +' + costTxt(o.r)); railSig = ''; renderPanel(); break; }
    case 'radioCall': { if (S.waiting || cap() <= S.surv.length || !pay({n:1})) break; makeWaiting(); sfx.ok(); toast('Appel radio entendu : quelqu\'un frappe au portail.'); renderPanel(); break; }
    case 'unlockW': { const k = +a; if (k !== weaponIdx() + 1 || !WEAPONS[k] || !pay({n:3 + 2 * k})) break; S.wun = k; S.wsel = k; sfx.build(); toast('Nouvelle arme : ' + WEAPONS[k].n + '.'); renderPanel(); break; }
    case 'export': openExport(); break;
    case 'import': openImport(); break;
    case 'copySave': { const ta = $('#code-out'); if (!ta) break; const done = () => toast('Code copié. Colle-le dans Réglages, Importer, de l\'autre côté.'); ta.focus(); ta.select(); try { ta.setSelectionRange(0, ta.value.length); } catch (e){}
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy') ? done() : toast('Copie bloquée : sélectionne le code à la main et copie-le.'); } catch (e){ toast('Copie bloquée : sélectionne le code à la main et copie-le.'); } });
      else { try { document.execCommand('copy'); done(); } catch (e){ toast('Sélectionne le code à la main et copie-le.'); } } break; }
    case 'doImport': { const ta = $('#code-in'), err = importCode(ta ? ta.value : ''); if (err){ toast(err); sfx.bad(); break; } closeSheet(); sfx.build(); toast('Partie importée. Bon retour dans ta rue.'); break; }
    case 'homes': { const pool = HOMES.map(h => h.id), list = []; while (list.length < 3){ const k = pool.splice(rint(0, pool.length - 1), 1)[0]; list.push(k); } homeOffers = {lot:+a, list}; sfx.ok(); renderPanel(); el.panel.scrollTop = 0; break; }
    case 'homesBack': homeOffers = null; renderPanel(); break;
    case 'buildHome': { const q = a.split(':'), i = +q[0], l = S.lots[i]; if (!l || l.k !== 'empty' || !HOMES.some(h => h.id === q[1]) || !pay({c:houseCost()})) break;
      const T = buildTime(i, 'house'); S.lots[i] = {k:'build', into:{k:'house', lvl:1, seed:rint(1, 1e9), st:q[1]}, t:T, T}; homeOffers = null; S.offers = null; sfx.build(); renderWorld(); markSel(); renderPanel(); break; }
    case 'buildSpecial': { const q = a.split(':'), i = +q[0], d = SPEC(q[1]), l = S.lots[i]; if (!l || l.k !== 'empty' || !d || hasSpec(d.id) || level() < d.lvl || !pay(specCost(d))) break;
      const T = buildTime(i, 'shop'); S.lots[i] = {k:'build', into:{k:'special', type:d.id, seed:rint(1, 1e9), n:1, cd:[0, 0, 0]}, t:T, T}; S.offers = null; sfx.build(); renderWorld(); markSel(); renderPanel(); break; }
    case 'hireMerc': { const l = S.lots[+a]; if (!l || l.k !== 'special' || l.type !== 'mercs' || l.n >= 3 || !pay({c:MERC_COST[l.n]})) break; l.n++; sfx.build(); toast('Un Gros Bras de plus au QG.'); renderPanel(); break; }
    case 'mercRun': { const l = S.lots[+a], ml = mercLot(); if (!l || l.k !== 'depot' || !l.run || !l.run.done || !ml) break; const k = ml.cd.slice(0, ml.n).findIndex(c => c <= 0); if (k < 0) break;
      const d = DEST.find(x => x.id === l.run.dest), sv = survBy(l.run.sid), loot = Math.round(d.loot * (1 + .2 * level()) * (sv && sv.perso === 'debrouillard' ? 1.4 : 1) * (hasHero('bebert') ? 1.25 : 1) * 1.25), coins = Math.round(loot * .25);
      ml.cd[k] = MERC_CD; S.supplies += loot; S.coins += coins; S.runs++; l.run = null; if (sv) sv.job = null; dirty(); sfx.coin(); bump('c-sup'); worldDirty = true;
      toast('Le Gros Bras a ramené le camion intact : +' + fmt(loot) + ' 📦 et +' + fmt(coins) + ' 🪙.'); renderPanel(); break; }
    case 'setWeapon': { const k = +a; if (k < 0 || k > weaponIdx()) break; S.wsel = k; dirty(); sfx.ok(); renderPanel(); break; }
    case 'miniWeapon': { const m = mini; if (!m || m.over || weaponIdx() < 1) break; m.wi = (m.wi + 1) % (weaponIdx() + 1); S.wsel = m.wi; const W = WEAPONS[m.wi]; m.mag = W.mag + 2; m.rl = W.rl * .8; m.ammo = 0; m.reload = m.rl * .6; dirty(); sfx.ok(); miniHud(); break; }
    case 'offers': if (!S.offers || S.offers.lot !== +a) drawOffers(+a); renderPanel(); break;
    case 'offersBack': S.offers = null; renderPanel(); break;
    case 'reroll': if (pay({c:rerollCost()})){ drawOffers(+a); sfx.ok(); renderPanel(); } break;
    case 'buildShop': {
      const p = a.split(':'), i = +p[0], d = SHOP[p[1]], l = S.lots[i]; if (!l || l.k !== 'empty' || !d || !S.offers || !S.offers.list.includes(d.id) || !pay({c:d.cost})) break;
      const T = buildTime(i, 'shop'); S.lots[i] = {k:'build', into:{k:'shop', type:d.id, seed:rint(1, 1e9), staff:[null, null, null], prods:blankProds()}, t:T, T}; S.offers = null;
      sfx.build(); renderWorld(); markSel(); renderPanel(); el.panel.scrollTop = 0; break; }
    case 'upHouse': { const l = S.lots[+a]; if (!l || l.k !== 'house' || l.lvl >= 3 || !pay({c:houseUpCost(l)})) break; l.lvl++; sfx.build(); renderWorld(); markSel(); renderPanel(); break; }
    case 'raze': {
      const i = +a, l = S.lots[i]; if (!l || l.k === 'empty' || l.k === 'build') break;
      if (l.k === 'depot' && l.run){ toast('Attends le retour du camion avant de raser le dépôt.'); break; }
      confirmCtx = {k:'raze', lot:i}; openConfirm('Raser ce bâtiment ?', 'Le terrain redevient libre et les employés sont libérés. Les stocks en cours sont perdus. Coût du bulldozer : ' + fmt(razeCost(i)) + ' 🪙.', 'Raser'); break; }
    case 'evict': { const s = survBy(+a); if (!s || s.job) break; confirmCtx = {k:'evict', id:s.id}; openConfirm('Renvoyer ' + esc(s.name) + ' ?', esc(s.name) + ' quittera la rue pour de bon et libérera un lit.', 'Renvoyer'); break; }
    case 'confirmYes': {
      const c = confirmCtx; if (!c){ closeSheet(); break; }
      if (c.k === 'reset'){ S = newGame(); S.intro = true; S.mig = true; sel = null; tab = 'rue'; afterLoad(false); saveLocal(); cloudSave(true); closeSheet(); toast('Nouvelle partie. Bonne chance.'); break; }
      if (c.k === 'raze'){ if (!pay({c:razeCost(c.lot)})){ closeSheet(); break; } freeStaffOf(c.lot); S.lots[c.lot] = {k:'empty'}; sfx.build(); renderWorld(); markSel(); closeSheet(); break; }
      if (c.k === 'evict'){ const s = survBy(c.id); if (s && !s.job){ S.surv = S.surv.filter(x => x.id !== c.id); dirty(); toast(s.name + ' a quitté la rue.'); renderWalkers(); } closeSheet(); break; }
      closeSheet(); break; }
    case 'pickStaff': { const p = a.split(':'), l = S.lots[+p[0]]; if (!l || l.k !== 'shop' || l.staff[+p[1]] != null) break; pickCtx = {k:'shop', lot:+p[0], slot:+p[1]}; openPick(); break; }
    case 'pickRunner': { const p = a.split(':'), l = S.lots[+p[0]], d = DEST.find(x => x.id === p[1]); if (!l || l.k !== 'depot' || l.run || !d || level() < d.lvl) break; pickCtx = {k:'run', lot:+p[0], dest:d.id}; openPick(); break; }
    case 'assignTo': {
      const s = survBy(+a); if (!s || s.job || !pickCtx) break; const l = S.lots[pickCtx.lot];
      if (pickCtx.k === 'shop'){ if (!l || l.k !== 'shop' || l.staff[pickCtx.slot] != null) break; l.staff[pickCtx.slot] = s.id; s.job = {k:'shop', lot:pickCtx.lot, slot:pickCtx.slot}; }
      else { const d = DEST.find(x => x.id === pickCtx.dest); if (!l || l.k !== 'depot' || l.run || !d) break; const T = Math.round(d.t * (hasHero('bebert') ? .7 : 1)); l.run = {dest:d.id, sid:s.id, t:T, T, done:false}; s.job = {k:'run', lot:pickCtx.lot}; S.st.sent++; toast(s.name + ' part pour : ' + d.n + '.'); }
      dirty(); sfx.ok(); pickCtx = null; renderWorld(); markSel(); closeSheet(); break; }
    case 'unstaff': unstaff(+a); break;
    case 'order': {
      const p = a.split(':'), i = +p[0], k = +p[1], l = S.lots[i]; if (!l || l.k !== 'shop' || l.staff[k] == null || l.prods[k].st !== 'empty') break;
      const d = SHOP[l.type], s = survBy(l.staff[k]); if (!pay({s:pCost(d, k, l)})) break;
      const L = pDur(d, k) * (s && s.perso === d.cat ? 1.5 : 1), T = Math.max(5, pDur(d, k) / 6);
      l.prods[k] = {st:'order', t:T, T, left:L, L, acc:0}; S.st.orders++; sfx.ok(); renderPanel(); updateBadges(); break; }
    case 'restockAll': {
      const todo = []; S.lots.forEach(l => { if (l.k === 'shop') l.prods.forEach((p, k) => { const s = l.staff[k] != null && survBy(l.staff[k]); if (s && p.st === 'empty') todo.push({l, k, s, c:pCost(SHOP[l.type], k, l)}); }); });
      todo.sort((x, y) => x.c - y.c); let n = 0;
      for (const o of todo){ if (o.c > S.supplies) break; S.supplies -= o.c; const d = SHOP[o.l.type], L = pDur(d, o.k) * (o.s.perso === d.cat ? 1.5 : 1), T = Math.max(5, pDur(d, o.k) / 6); o.l.prods[o.k] = {st:'order', t:T, T, left:L, L, acc:0}; S.st.orders++; n++; }
      if (n){ dirty(); sfx.ok(); toast(n + ' commande' + (n > 1 ? 's passées' : ' passée') + (n < todo.length ? ', pas assez de vivres pour le reste.' : '.')); }
      else { toast('Pas assez de vivres. Dégomme des zombies ou envoie un camion.'); sfx.bad(); }
      renderPanel(); updateBadges(); break; }
    case 'knock': camTo(OUT_W - 118); openWaiting(); break;
    case 'accept': {
      const w = S.waiting; if (!w){ closeSheet(); break; }
      if (S.surv.length >= cap()){ toast('Pas de lit libre. Construis ou agrandis un logement.'); sfx.bad(); break; }
      S.surv.push({id:S.nextId++, name:w.name, perso:w.perso, lvl:w.lvl || 1, look:w.look, job:null}); S.st.welcomed++; S.waiting = null; S.waitT = rnd(40, 75); dirty();
      sfx.coin(); toast(w.name + ' rejoint la rue.'); renderKnock(); renderWalkers(); closeSheet(); break; }
    case 'refuse': S.waiting = null; S.waitT = rnd(20, 40); dirty(); renderKnock(); closeSheet(); break;
    case 'unload': startMini(+a); break;
    case 'miniReload': if (mini && !mini.over && mini.reload <= 0 && mini.ammo < mini.mag){ mini.reload = mini.rl; mini.ammo = 0; miniHud(); } break;
    case 'rush': { const l = S.lots[+a]; if (!l || l.k !== 'build' || !pay({n:rushCost(l.t)})) break; l.t = 0; finishBuild(+a, false); renderPanel(); break; }
    case 'rushRun': { const l = S.lots[+a]; if (!l || l.k !== 'depot' || !l.run || l.run.done || !pay({n:rushRunCost(l.run.t)})) break; l.run.t = 0; l.run.done = true; sfx.horn(); worldDirty = true; renderPanel(); break; }
    case 'recruit': { const o = HEROES.find(x => x.id === a); if (!o || hasHero(a) || level() < o.lvl || !pay({n:o.cost})) break; S.heroes.push(a); sfx.build(); toast(o.n + ' s\'installe dans la rue. ' + o.d); renderWalkers(); renderPanel(); break; }
    case 'wardrobe': openWardrobe(+a); break;
    case 'wear': case 'buyCos': { const k = a.indexOf(':'), sv = survBy(+a.slice(0, k)), cid = a.slice(k + 1), c = COSTUMES.find(x => x.id === cid); if (!sv || !c) break;
      if (name === 'buyCos'){ if (S.ward.includes(cid) || !pay(c.cost)) break; S.ward.push(cid); sfx.build(); }
      sv.look.cos = cid; dirty(); renderWalkers(); renderPanel(); openWardrobe(sv.id); break; }
    case 'claimTask': { const t = S.tasks[+a]; if (!t || !taskDone(t)) break; S.coins += t.r.c || 0; S.supplies += t.r.s || 0; S.nuts += t.r.n || 0; S.tasks.splice(+a, 1); ensureTasks(); dirty(); sfx.coin();
      bump(t.r.n ? 'c-nuts' : t.r.c ? 'c-coins' : 'c-sup'); toast('Tâche remplie : +' + costTxt(t.r)); railSig = ''; renderPanel(); break; }
    case 'miniClose': el.mini.hidden = true; mini = null; renderWorld(); markSel(); renderPanel(); break;
    case 'upGate': { const gn = GATES[S.gate + 1]; if (!gn || !pay({c:gn.cost})) break; S.gate++; S.gateHp = gn.hp; sfx.build(); toast('Portail renforcé : ' + gn.n + '.'); renderGate(); renderPanel(); break; }
  }
}
document.addEventListener('click', e => {
  const t = e.target.closest ? e.target.closest('[data-act]') : null; if (!t) return;
  if ((t.dataset.act === 'sel' || t.dataset.act === 'gate' || t.dataset.act === 'quick') && t.closest('#scene') && performance.now() < suppressClick) return;
  act(t.dataset.act, t.dataset.a);
});

/* ================= boot & loop ================= */
function afterLoad(fromCloud){
  Z.splice(0).forEach(z => z.el.remove()); LOOT.splice(0).forEach(o => o.el.remove()); spawnT = 5; hudPrev = {}; questSig = ''; railSig = '';
  const gap = (Date.now() - (S.lastSeen || Date.now())) / 1000; let r = null; if (gap > 20) r = offlineSim(gap);
  if (typeof sel === 'number' && sel > S.lots.length) sel = null;
  layout(); renderGate(); renderWorld(); camX = Math.max(0, OUT_W - 118); camT = null; applyCam(); renderKnock(); setTab(); renderPanel(); refreshUI();
  if (r && r.sec > 90 && r.coins >= 1 && !fromCloud) openOffline(r);
}
let last = 0, accUI = 0, accSave = 0, accCloud = 0;
function frame(now){
  if (!last) last = now;
  let dt = (now - last) / 1000; last = now;
  if (dt > 1.5){ offlineSim(dt); dt = 0; }
  else if (dt > 0){
    econTick(dt, false);
    if (mini) miniTick(Math.min(dt, .1)); else if (!sheetOpen) actionTick(Math.min(dt, .1));
    if (camT != null){ camX += (camT - camX) * Math.min(1, dt * 9); if (Math.abs(camT - camX) < .5){ camX = camT; camT = null; } applyCam(); }
    else if (Math.abs(camV) > 4){ camX += camV * dt; camV *= Math.pow(.02, dt); if (camX <= 0 || camX >= worldW - viewW) camV = 0; applyCam(); }
  }
  accUI += dt; if (accUI > .33){ accUI = 0; refreshUI(); }
  accSave += dt; if (accSave > 5){ accSave = 0; saveLocal(); }
  accCloud += dt; if (accCloud > 30){ accCloud = 0; cloudSave(false); }
  requestAnimationFrame(frame);
}
function boot(){
  S = loadLocal() || newGame();
  bootSavedAt = S.savedAt || 0;
  let recovered = false;
  if (!S.mig){ try { const raw = localStorage.getItem('rds_save_v1'); if (raw){ recovered = tryMigrate(JSON.parse(raw), false); if (recovered) localMigFrom = migInfo ? migInfo.from : 0; } } catch (e) {} }
  afterLoad(false);
  if (recovered){ saveLocal(); openMigrated(); }
  else if (!S.intro && !sheetOpen) openIntro();
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden'){ hiddenAt = Date.now(); saveLocal(); cloudSave(false); }
    else { if (hiddenAt){ const gap = (Date.now() - hiddenAt) / 1000; if (gap > 1.5) offlineSim(gap); hiddenAt = 0; } last = 0; }
  });
  window.addEventListener('pagehide', () => saveLocal());
  window.addEventListener('resize', () => { layout(); });
  requestAnimationFrame(frame);
  initCloud();
}
boot();
})();
